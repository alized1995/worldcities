<div class="header-container">
  <h2>Countries</h2>
  <div class="import-section">
  <input type="file" (change)="onFileSelected($event)" accept=".xlsx">
  <button mat-raised-button color="accent" (click)="onUpload()" [disabled]="!selectedFile">
   Import from Excel
  </button>
</div>

  
    <mat-label>Filter by Name, ISO2 or ISO3...</mat-label>
    <input matInput #filterInput (keyup)="onFilterTextChanged(filterInput.value)" placeholder="Ex. United States">
</div>

<table mat-table [dataSource]="countries" class="mat-elevation-z8"
       matSort [matSortActive]="defaultSortColumn" [matSortDirection]="defaultSortOrder"
       (matSortChange)="loadData()">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
    <td mat-cell *matCellDef="let country">{{country?.id}}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let country">{{country?.name}}</td>
  </ng-container>

  <ng-container matColumnDef="iso2">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ISO2</th>
    <td mat-cell *matCellDef="let country">{{country.iso2}}</td>
  </ng-container>

  <ng-container matColumnDef="iso3">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ISO3</th>
    <td mat-cell *matCellDef="let country">{{country?.iso3}}</td>
  </ng-container>

  <ng-container matColumnDef="totCities">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Total Cities</th>
    <td mat-cell *matCellDef="let country">{{country.totCities}}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [hidden]="!countries"
               (page)="loadData($event)"
               [pageSize]="defaultPageSize"
               [pageSizeOptions]="[10, 20, 50]"
               showFirstLastButtons>
</mat-paginator>
